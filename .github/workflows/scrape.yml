name: Cloud Outbound Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Scraper Pipeline
        shell: pwsh
        run: |
          ./run-scraper.ps1 `
            -Query "Residential Roofing Contractors in Dallas, Texas" `
            -BBox @(32.775, -96.820, 32.805, -96.770) `
            -CellSize 2.0 `
            -Depth 1 `
            -Email `
            -OutDir "gmaps-output"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add gmaps-output/
          git commit -m "Automated scrape: updated prospects [skip ci]" || echo "No changes to commit"
          git push
