name: Cloud Outbound Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reset State for Fresh Run
        run: rm -f scrape-state.json

      - name: Execute Scraper Pipeline
        shell: pwsh
        run: ./run-scraper.ps1

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          mkdir -p gmaps-output

          git add gmaps-output/ || true
          git add scrape-state.json || true

          git commit -m "Automated scrape: updated prospects and state [skip ci]" || echo "No changes to commit"
          git push
